version: "3.8"
services:
  momo-ktv:
    # 自己的镜像：由本仓库 GitHub Actions 构建后推送到 GHCR。
    # 飞牛 NAS 上无需源码、无需本地构建，直接 pull 即可运行。
    image: ghcr.io/klzbw/momo-ktv:latest
    container_name: momo-ktv
    restart: unless-stopped
    # 宿主机固定 8083 端口，容器内部固定 8080，保持与旧版一致，反代无需改动。
    ports:
      - "8083:8080"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - DATA_DIR=/data
      - MV_DIR=/mv
      # VAAPI 渲染节点路径，容器内代码据此判断硬件加速是否可用；与下面
      # devices 段落是否被安装脚本裁掉保持一致（宿主机没有核显/独显时，
      # cmd/install_init、cmd/upgrade_init 会自动删掉 devices 段落）。
      - VAAPI_DEVICE=/dev/dri/renderD128
      # HLS 缓存每日清理：距上次转码完成超过这个天数、且最近未被重新点唱的
      # 缓存会被自动清理释放磁盘空间，源 MV 文件不受影响，下次点唱会重新生成。
      - HLS_CACHE_MAX_AGE_DAYS=3
    volumes:
      # 数据库/封面与 MV 曲库统一放在飞牛默认共享目录下的 momo-ktv 子目录
      - /vol1/@appshare/momo-ktv/data:/data    # 数据库/封面持久化
      - /vol1/@appshare/momo-ktv/mv:/mv        # MV 曲库文件
    # VAAPI_DEVICES_BEGIN
    # 直通宿主机的 DRI 渲染节点，供 ffmpeg 使用 h264_vaapi 做硬件编解码。
    # 注意：如果宿主机没有 /dev/dri（纯软件环境/无核显的老机器），
    # `docker compose up` 会因为设备不存在而直接报错退出，因此这整段
    # (含 devices: 键) 是否保留在最终生效的 docker-compose.yml 里，由
    # cmd/install_init 和 cmd/upgrade_init 在真实宿主机上安装/升级时
    # 动态探测决定：探测不到 /dev/dri/renderD128 就会把这段一起删掉，
    # 保证没有硬件加速的机器应用依然能正常启动（仅走软件转码）。
    devices:
      - /dev/dri:/dev/dri
    # VAAPI_DEVICES_END

  # =====================================================================
  # AI Worker（人声分离 Demucs + 逐字歌词 WhisperX）。默认带 profiles，
  # `docker compose up` 不会启动它；安装向导选了"在本机运行 AI"后，安装
  # 脚本会删掉对应段的 profiles 行把它启用、并删掉另一段。三选一：
  #   外置 PC 显卡（推荐）：两段都删除，AI 跑在独立 Windows 工作站；
  #   本机 CPU：保留 ai-worker-cpu（慢，任何机器可跑）；
  #   本机 N 卡：保留 ai-worker-cuda（快，需宿主机 nvidia-container-toolkit）。
  # 任务调度由服务端 separate.js 完成：有 GPU worker 在线时优先给 GPU，
  # 任务排队超过 45 秒没被 GPU 领走才让 CPU 兜底。
  # =====================================================================
  # AI_CPU_BEGIN
  ai-worker-cpu:
    profiles: ["ai-cpu"]
    image: ghcr.io/klzbw/momo-ai-worker:ai-cpu
    container_name: momo-ai-worker-cpu
    restart: unless-stopped
    depends_on: [momo-ktv]
    environment:
      - TZ=Asia/Shanghai
      # 同 compose 内网，直接用主服务容器名 + 容器内端口 8080
      - MOMO_SERVER=http://momo-ktv:8080
      - MOMO_WORKER=fnos-ai-cpu
      - MOMO_MODE=both
      - MOMO_CAPABILITY=cpu
    volumes:
      # AI 模型（约 3GB，首次运行自动下载）持久化，只下一次
      - /vol1/@appshare/momo-ktv/data/ai-models:/models
  # AI_CPU_END
  # AI_CUDA_BEGIN
  ai-worker-cuda:
    profiles: ["ai-cuda"]
    image: ghcr.io/klzbw/momo-ai-worker:ai-cuda
    container_name: momo-ai-worker-cuda
    restart: unless-stopped
    depends_on: [momo-ktv]
    environment:
      - TZ=Asia/Shanghai
      - MOMO_SERVER=http://momo-ktv:8080
      - MOMO_WORKER=fnos-ai-cuda
      - MOMO_MODE=both
      # 不写死 MOMO_CAPABILITY，由 entrypoint 探测到 N 卡后自动置 gpu
    volumes:
      - /vol1/@appshare/momo-ktv/data/ai-models:/models
    # 放行宿主机 NVIDIA GPU；前提是飞牛宿主机已装 nvidia-container-toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  # AI_CUDA_END
