name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-tv-client/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Sign Release APK (debug keystore)
        if: success() || failure()
        run: |
          # 生成 debug keystore 用于签名（仅 CI 测试用）
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US" 2>/dev/null || true
          # 查找 release APK
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/*/apksigner sign --ks debug.keystore \
              --ks-pass pass:android --key-pass pass:android \
              --out app/build/outputs/apk/release/momo-ktv-tv-signed.apk "$APK_PATH" 2>/dev/null || true
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: momo-ktv-tv-debug
          path: android-tv-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: momo-ktv-tv-release
          path: |
            android-tv-client/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
