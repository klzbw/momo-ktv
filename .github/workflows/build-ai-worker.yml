name: Build AI Worker Image

# 构建并推送 AI Worker（Demucs 人声分离 + WhisperX 逐字歌词）镜像到 GHCR：
#   ghcr.io/klzbw/momo-ai-worker:ai-cpu   —— CPU 版，任何 x86_64 飞牛可跑（慢）
#   ghcr.io/klzbw/momo-ai-worker:ai-cuda  —— N 卡版，需要宿主机 nvidia-container-toolkit
# 改动 ai-worker/ 时自动构建，也可手动触发。
on:
  push:
    branches: [main]
    paths:
      - 'ai-worker/**'
      - '.github/workflows/build-ai-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: ai-worker
          file: ai-worker/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ghcr.io/klzbw/momo-ai-worker:ai-cpu
            ghcr.io/klzbw/momo-ai-worker:ai-cpu-${{ github.sha }}

  build-cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: ai-worker
          file: ai-worker/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ghcr.io/klzbw/momo-ai-worker:ai-cuda
            ghcr.io/klzbw/momo-ai-worker:ai-cuda-${{ github.sha }}
