name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios-client/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen || true

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Pods (MobileVLCKit + Starscream)
        run: |
          pod install --repo-update
        timeout-minutes: 30

      - name: Build (Debug, no signing)
        run: |
          xcodebuild \
            -workspace MomoKtviOS.xcworkspace \
            -scheme MomoKtviOS \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | xcpretty
        timeout-minutes: 30

      - name: Archive
        if: success()
        run: |
          xcodebuild \
            -workspace MomoKtviOS.xcworkspace \
            -scheme MomoKtviOS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/MomoKtviOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            | xcpretty
        timeout-minutes: 30
        continue-on-error: true

      - name: Export IPA (unsigned)
        if: success()
        run: |
          # 创建 exportOptions.plist（不签名，用于测试构建）
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/MomoKtviOS.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            | xcpretty || true
          # 如果签名导出失败，手动打包 .app 为 .ipa
          if [ ! -f build/ipa/MomoKtviOS.ipa ]; then
            mkdir -p build/ipa/Payload
            cp -R build/Build/Products/Release-iphoneos/MomoKtviOS.app build/ipa/Payload/
            cd build/ipa && zip -r MomoKtviOS-unsigned.ipa Payload && cd ../..
          fi
        continue-on-error: true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: momo-ktv-ios
          path: |
            ios-client/build/ipa/*.ipa
            ios-client/build/Build/Products/Release-iphoneos/*.app
          if-no-files-found: warn

      # ===== 签名说明 =====
      # 正式发布 IPA 需要在 GitHub Secrets 中配置：
      #   IOS_CODE_SIGN_IDENTITY: 证书名称（如 "Apple Development: xxx"）
      #   IOS_PROVISIONING_PROFILE: 描述文件 UUID
      #   IOS_TEAM_ID: 团队 ID
      #   P12_CERTIFICATE_BASE64: p12 证书 base64
      #   P12_PASSWORD: p12 密码
      # 然后在 xcodebuild 中移除 CODE_SIGNING_ALLOWED=NO，使用：
      #   CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY"
      #   PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE"
      #   DEVELOPMENT_TEAM="$IOS_TEAM_ID"
