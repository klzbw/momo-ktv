name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios-client/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen || true

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Pods (MobileVLCKit + Starscream)
        run: |
          pod install --repo-update
        timeout-minutes: 30

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MomoKtviOS.xcworkspace \
            -scheme MomoKtviOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          echo "BUILD_EXIT_CODE=$?"
        timeout-minutes: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios-client/build.log
          if-no-files-found: ignore

      - name: Verify binary
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MomoKtviOS.app"
          echo "=== .app contents ==="
          ls -la "$APP_PATH" || echo "APP NOT FOUND"
          echo "=== Binary check ==="
          if [ -f "$APP_PATH/MomoKtviOS" ]; then
            file "$APP_PATH/MomoKtviOS"
            echo "BINARY EXISTS"
          else
            echo "BINARY MISSING!"
            find build -name "MomoKtviOS" -type f 2>/dev/null || true
            exit 1
          fi

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MomoKtviOS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found at $APP_PATH"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r MomoKtviOS.ipa Payload && cd ../..
          ls -la build/ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: momo-ktv-ios
          path: ios-client/build/ipa/MomoKtviOS.ipa
          if-no-files-found: error

      # ===== 签名说明 =====
      # 正式发布 IPA 需要在 GitHub Secrets 中配置：
      #   IOS_CODE_SIGN_IDENTITY: 证书名称（如 "Apple Development: xxx"）
      #   IOS_PROVISIONING_PROFILE: 描述文件 UUID
      #   IOS_TEAM_ID: 团队 ID
      #   P12_CERTIFICATE_BASE64: p12 证书 base64
      #   P12_PASSWORD: p12 密码
      # 然后在 xcodebuild 中移除 CODE_SIGNING_ALLOWED=NO，使用：
      #   CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY"
      #   PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE"
      #   DEVELOPMENT_TEAM="$IOS_TEAM_ID"
