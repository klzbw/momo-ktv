name: Build iOS IPA

# 构建 iPad/iPhone 通用客户端（WKWebView 套壳网页版，部署目标 iOS 12.0）
on:
  push:
    branches: [main]
    paths:
      - 'ios-client/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-client

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # 兼容 Xcode 15.4
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' MomoKtviOS.xcodeproj/project.pbxproj || true

      - name: Build iOS app (unsigned, iOS 12 target)
        run: |
          xcodebuild \
            -project MomoKtviOS.xcodeproj \
            -scheme MomoKtviOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist" || true
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MomoKtviOS.ipa Payload
          ls -la MomoKtviOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MomoKtviOS-unsigned
          path: ios-client/MomoKtviOS.ipa
          retention-days: 30
