name: Build Docker Image

# 推送到 main（改动 app/docker、server、web、package.json 或本 workflow）自动构建并推送 GHCR；也可手动触发。
# 产出：ghcr.io/klzbw/momo-ktv:latest 与 :sha-xxxxxx
# 闭环：服务器侧 watchtower 轮询 GHCR，发现 latest 的 digest 变化即自动 pull 并重建容器。
on:
  push:
    branches: [main]
    paths:
      - 'app/docker/**'
      - 'server/**'
      - 'web/**'
      - 'package.json'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# 同一分支连续推送时，取消还在跑的旧构建、只保留最新一次，省 CI 额度
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/klzbw/momo-ktv
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # 构建上下文为仓库根目录：Dockerfile 内 COPY server/web 直接用根目录最新源码，
          # 不再使用 app/docker 下的历史副本，避免镜像代码陈旧
          context: .
          file: app/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TIME=${{ github.run_attempted_at }}
          # 关键：禁用构建期层缓存。曾出现 git 源码已修好，但 COPY server 命中
          # gha 旧层导致镜像里一直是旧文件、NAS 拉到的层 "Already exists" 永不更新。
          # server/web 体积很小，全量重建多花 2-3 分钟，换"镜像内容恒等于当前 git 源码"。
          # 因此不再配置 cache-from/cache-to（与 no-cache 冲突、无收益）。
          no-cache: true

      - name: Build summary
        run: |
          {
            echo "### 镜像已推送到 GHCR"
            echo "- tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 闭环：镜像推送成功后回调 NAS 上的部署 webhook，
      # NAS 后端自动 docker pull 新镜像并重建容器（等价 docker compose pull && up -d）。
      # 注意：NAS 在局域网，runner 无法直连 192.168.3.x。
      # NAS_DEPLOY_WEBHOOK_URL 需填 NAS 公网可达地址（公网 IPv6 / 反向代理域名），
      # 形如 http://[<公网IPv6>]:8083/api/deploy/webhook?token=<DEPLOY_WEBHOOK_TOKEN>
      # 即使本步因网络不可达失败，也不影响镜像构建（continue-on-error），
      # 且 NAS 上 watchtower 每 5 分钟轮询 GHCR 仍会兜底自动更新。
      - name: Trigger NAS deploy webhook
        if: success()
        continue-on-error: true
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.NAS_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "NAS_DEPLOY_WEBHOOK_URL 未配置，跳过 webhook（依赖 watchtower 兜底）"
            exit 0
          fi
          echo "回调 NAS 部署 webhook..."
          curl -fsS --max-time 30 "$DEPLOY_WEBHOOK_URL" \
            && echo "webhook 回调成功" \
            || echo "::warning::webhook 回调失败（NAS 公网不可达，watchtower 兜底）"