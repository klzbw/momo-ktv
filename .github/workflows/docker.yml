name: Build Docker Image

# 推送到 main（改动 app/docker 时）自动构建并推送 GHCR 镜像；也可手动触发。
# 推送后镜像：ghcr.io/klzbw/momo-ktv:latest 与 ghcr.io/klzbw/momo-ktv:sha-xxxxxx
on:
  push:
    branches: [main]
    paths:
      - 'app/docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/klzbw/momo-ktv
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Dockerfile 内的 COPY server/COPY web 均相对 app/docker 目录
          context: app/docker
          file: app/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关键修复：禁用构建期层缓存。曾出现 git 源码已修好 hlsgen 混声滤镜，但
          # `COPY server` 命中 gha 里的旧层（坏滤镜），导致镜像里一直是旧文件、
          # NAS 拉到的层 "Already exists" 永不更新。server/web 体积很小，全量重建
          # 多花 2-3 分钟，换取"镜像内容永远等于当前 git 源码"，值得。
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
