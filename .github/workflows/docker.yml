name: Build Docker Image

# 推送到 main（改动 app/docker 或本 workflow）自动构建并推送 GHCR；也可手动触发。
# 产出：ghcr.io/klzbw/momo-ktv:latest 与 :sha-xxxxxx
# 闭环：服务器侧 watchtower 轮询 GHCR，发现 latest 的 digest 变化即自动 pull 并重建容器。
on:
  push:
    branches: [main]
    paths:
      - 'app/docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# 同一分支连续推送时，取消还在跑的旧构建、只保留最新一次，省 CI 额度
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/klzbw/momo-ktv
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # Dockerfile 内的 COPY server / COPY web 均相对 app/docker 目录
          context: app/docker
          file: app/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关键：禁用构建期层缓存。曾出现 git 源码已修好，但 COPY server 命中
          # gha 旧层导致镜像里一直是旧文件、NAS 拉到的层 "Already exists" 永不更新。
          # server/web 体积很小，全量重建多花 2-3 分钟，换"镜像内容恒等于当前 git 源码"。
          # 因此不再配置 cache-from/cache-to（与 no-cache 冲突、无收益）。
          no-cache: true

      - name: Build summary
        run: |
          {
            echo "### 镜像已推送到 GHCR"
            echo "- tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
