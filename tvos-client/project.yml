name: MomoKtvTV
options:
  bundleIdPrefix: com.momo
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  projectFormat: Xcode 14.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "3"
    SDKROOT: appletvos
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MomoKtvTV:
    type: application
    platform: tvOS
    sources:
      - path: MomoKtvTV
    postBuildScripts:
      - name: Set Chinese Display Name
        script: |
          PLIST="${CODESIGNING_FOLDER_PATH:-$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME}/Info.plist"
          # Top Shelf配置已在Info.plist中静态定义，此处仅确保中文显示名正确
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 墨墨爱K歌" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 墨墨爱K歌" "$PLIST"
          echo "CFBundleDisplayName=$( /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" )"
          echo "TVTopShelfImage=$( /usr/libexec/PlistBuddy -c 'Print :TVTopShelfImage:TVTopShelfPrimaryImage' "$PLIST" 2>/dev/null || echo 'NOT FOUND' )"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momo.ktv.tv
        PRODUCT_NAME: "MomoKtvTV"
        INFOPLIST_FILE: MomoKtvTV/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
